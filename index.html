<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Typing Poem</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1 class="title">Poem Typing Website</h1>
    </header>
    <section class="hero">
        <img src="https://picsum.photos/300/100" alt="Sample Hero Image">
        <h2>Welcome to the Poem Typing Website</h2>
        <p>Enjoy the live-typing poems and explore more!</p>
    </section>
    <section class="poem-section">
        <div class="container">
            <div class="poem">
                <p id="poem-line"></p>
            </div>
        </div>
    </section>
    <section class="content">
        <div class="container">
            <div class="content-item">
                <img src="https://picsum.photos/301/300" alt="Sample Image 1">
                <h3>Section Title 1</h3>
                <p>Sample text for the first section.</p>
            </div>
            <div class="content-item">
                <img src="https://picsum.photos/300/300" alt="Sample Image 2">
                <h3>Section Title 2</h3>
                <p>Sample text for the second section.</p>
            </div>
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
