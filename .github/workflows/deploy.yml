name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  repository_dispatch:        # sent by the vault repo when its Site/ folder changes
    types: [content]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # the pages live in the private vault repo (its Site/ folder); VAULT_TOKEN is a fine-grained
      # personal access token with Contents read on ernjg/E1-vault
      - name: Fetch the content from the vault
        uses: actions/checkout@v4
        with:
          repository: ernjg/E1-vault
          token: ${{ secrets.VAULT_TOKEN }}
          path: vault
          sparse-checkout: Site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install --from-config
      - name: Build Quartz
        run: npx quartz build -d vault/Site
        env:
          SITE_EMAIL: ${{ secrets.SITE_EMAIL }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
